name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend CI (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python syntax and imports
        working-directory: ./backend
        run: |
          python -m py_compile main.py models.py database.py security.py auth.py
          python -c "import main; print('Backend modules loaded successfully!')"

      - name: Run Alembic migrations test
        working-directory: ./backend
        run: |
          DATABASE_URL="sqlite:///./ci_test.db" alembic upgrade head
          rm -f ci_test.db

  frontend-ci:
    name: Frontend CI (Node 22 LTS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies with clean install
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Build React Vite SPA
        working-directory: ./frontend
        env:
          VITE_API_URL: "https://api.example.com"
        run: npm run build
